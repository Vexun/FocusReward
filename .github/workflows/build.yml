name: Build

on:
  push:
    branches: [main]
  release:
    types: [created]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build extension
        working-directory: extension
        run: |
          mkdir -p dist
          zip -r dist/focusreward-extension.zip . \
            -x "dist/*" "*.git*" "README.md"

      - name: Build AppImage
        working-directory: src-tauri
        run: cargo tauri build

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: focusreward-linux
          path: src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: focusreward-extension
          path: extension/dist/focusreward-extension.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build extension
        working-directory: extension
        run: |
          mkdir -p dist
          Compress-Archive -Path * -DestinationPath dist/focusreward-extension.zip

      - name: Build NSIS installer
        working-directory: src-tauri
        run: cargo tauri build

      - name: Sign installer
        if: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_BASE64 }}")
          $certPath = "$env:TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          & 'signtool' sign /fd SHA256 /f $certPath `
            /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" `
            /tr http://timestamp.digicert.com /td SHA256 `
            (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: focusreward-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: focusreward-extension
          path: extension/dist/focusreward-extension.zip

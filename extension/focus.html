<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FocusReward - Blocked</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 420px;
    }
    h1 { font-size: 3rem; margin-bottom: 1rem; }
    .blocked-icon { font-size: 4rem; margin-bottom: 1rem; }
    h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #94a3b8; margin-bottom: 0.5rem; }
    .info { margin: 1.5rem 0; }
    .info-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .info-item .label { color: #94a3b8; font-size: 0.875rem; }
    .info-item .value { font-weight: 600; font-size: 1.125rem; }
    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin: 0.5rem;
    }
    .btn-primary { background: #38bdf8; color: #0f172a; }
    .btn-primary:hover { background: #7dd3fc; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-secondary:hover { background: #475569; }
    .error { color: #ef4444; font-size: 0.875rem; margin-top: 0.5rem; }
    .success { color: #22c55e; font-size: 0.875rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="blocked-icon">🔒</div>
    <h2 id="siteName">This site is blocked</h2>
    <p>Complete tasks to earn points, then unlock this site.</p>

    <div class="info">
      <div class="info-item">
        <span class="label">Points Balance</span>
        <span class="value" id="balance">---</span>
      </div>
      <div class="info-item">
        <span class="label">Unlock Cost</span>
        <span class="value" id="cost">---</span>
      </div>
    </div>

    <button class="btn btn-primary" id="unlockBtn">Unlock</button>
    <a href="http://127.0.0.1:41000" target="_blank" class="btn btn-secondary">Open Dashboard</a>

    <div id="statusMsg"></div>
  </div>

  <script src="webextension-polyfill.js"></script>
  <script src="config.js"></script>
  <script src="focus.js"></script>
</body>
</html>
